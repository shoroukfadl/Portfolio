<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <meta
          name="description"
          content="Shorouk Fadl — Flutter Developer"
  >

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Shorouk Fadl | Flutter Developer</title>

  <link rel="manifest" href="manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    // ─── Theme detection: runs before any paint, no flash ───────────────
    // Mirrors ThemeCubit.getCurrentTheme() exactly:
    // SharedPref.getTheme() returns a bool (stored via shared_preferences_web
    // as the literal string "true"/"false" under key "flutter.theme"),
    // and defaults to false (light) when nothing is saved yet — NOT the
    // device's prefers-color-scheme. Splash must match this or the app
    // will visibly flip themes the instant Flutter takes over.
    (function () {
      var raw = null;
      try {
        raw = localStorage.getItem('flutter.theme');
      } catch (e) {
        // localStorage may be unavailable (private mode, etc.)
      }

      var isDark = raw === 'true'; // null or 'false' => light, matching ThemeState.init()
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
    })();
  </script>

  <style>
    :root{
      /* dark theme (default) */
      --background:#121218;
      --accent:#6d78c9;
      --accent-soft:#2a2c47;
      --text1:#f4f4f8;
      --text2:#c4c6d8;
      --text3:#8b8fa8;
    }

    html[data-theme="light"]{
      --background:#f4f4f8;
      --accent:#4753a8;
      --accent-soft:#e2e4ee;
      --text1:#1a1d33;
      --text2:#3f4661;
      --text3:#6d7288;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: var(--background);
      overflow: hidden;
    }

    body {
      min-height: 100vh;
    }

    flt-glass-pane {
      background-color: var(--background) !important;
    }

    /* ─── Splash ─────────────────────────────────────────────────────── */
    #splash{
      position:fixed;
      inset:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      background:var(--background);
      font-family:'Inter', sans-serif;
      z-index:9999;
      transition:opacity .4s ease;
    }

    #splash.hide{
      opacity:0;
      pointer-events:none;
    }

    #mark{
      width:180px;
      height:180px;
      margin-bottom:32px;
    }

    #mark path{
      fill:none;
      stroke:var(--accent);
      stroke-width:2.6;
      stroke-linecap:round;
      stroke-linejoin:round;
      stroke-dasharray:520;
      stroke-dashoffset:520;
      animation:draw 2.4s cubic-bezier(.65,0,.35,1) infinite;
    }

    @keyframes draw{
      0%{ stroke-dashoffset:520; opacity:.35; }
      8%{ opacity:1; }
      55%{ stroke-dashoffset:0; opacity:1; }
      80%{ stroke-dashoffset:0; opacity:1; }
      100%{ stroke-dashoffset:-520; opacity:.35; }
    }

    #label{
      font-size:14px;
      font-weight:500;
      letter-spacing:.2px;
      color:var(--text2);
      margin-bottom:20px;
    }

    #label span{
      color:var(--text1);
      font-weight:600;
    }

    #progress-row{
      display:flex;
      align-items:center;
      gap:12px;
    }

    #track{
      width:140px;
      height:3px;
      border-radius:2px;
      background:var(--accent-soft);
      position:relative;
      overflow:hidden;
    }

    #fill{
      position:absolute;
      inset:0;
      width:0%;
      background:var(--accent);
      border-radius:2px;
      transition:width .25s ease;
    }

    #percent{
      font-size:12px;
      font-weight:500;
      color:var(--text3);
      min-width:32px;
      text-align:right;
      font-variant-numeric:tabular-nums;
    }

    @media (prefers-reduced-motion: reduce){
      #mark path{ animation:none; stroke-dashoffset:0; opacity:1; }
    }
  </style>
</head>

<body>

<div id="splash">
  <svg id="mark" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <path d="M 40 130 C 55 60, 85 55, 95 100 C 105 145, 130 145, 140 100 C 148 65, 165 65, 168 90" />
  </svg>

  <div id="label">loading <span>portfolio</span></div>

  <div id="progress-row">
    <div id="track"><div id="fill"></div></div>
    <div id="percent">0%</div>
  </div>
</div>

<script>
  // called from Dart once PortfolioCubit reaches success or error
  function hideSplash() {
    var splash = document.getElementById('splash');
    if (!splash) return;

    var fill = document.getElementById('fill');
    var percent = document.getElementById('percent');
    if (fill) fill.style.width = '100%';
    if (percent) percent.textContent = '100%';

    setTimeout(function () {
      splash.classList.add('hide');
      setTimeout(function () { splash.remove(); }, 500);
    }, 150);
  }
  window.hideSplash = hideSplash;

  // cosmetic progress fill while real data loads — purely visual, not tied to actual bytes
  (function () {
    var p = 0;
    var fill = document.getElementById('fill');
    var percent = document.getElementById('percent');
    var timer = setInterval(function () {
      p += Math.random() * 6;
      if (p >= 92) { p = 92; clearInterval(timer); } // hold near-full until hideSplash() fires
      fill.style.width = p + '%';
      percent.textContent = Math.floor(p) + '%';
    }, 200);
  })();
</script>

<script src="flutter_bootstrap.js" async></script>

</body>
</html>
