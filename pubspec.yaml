name: portfolio
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  # UI & Utilities
  cupertino_icons: ^1.0.6
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  get_it: ^9.2.1
  universal_html: ^2.2.4
  shared_preferences: ^2.2.3
  google_fonts: ^8.1.0
  go_router: ^17.2.3
  flutter_staggered_animations: ^1.1.1
  flutter_spinkit: ^5.2.1
  change_app_package_name: ^1.5.0
  path: ^1.9.0
  cached_network_image:
  awesome_snackbar_content:
  url_strategy:
  url_launcher: ^6.3.1
  responsive_framework: ^1.5.1
  supabase_flutter: ^2.8.4
  intl: ^0.20.2
  hydrated_bloc: ^11.0.0
  path_provider: ^2.1.6
  visibility_detector: ^0.4.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_annotation: ^4.11.0
  json_serializable: ^6.8.0
  build_runner: ^2.4.13

  flutter_launcher_icons: "^0.14.4"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.jpg"
  web:
    generate: true
    image_path: "assets/logo.jpg"
    background_color: "#FFFFFF"
    theme_color: "#000000"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/Languages/
    - assets/icons/
  fonts:
    - family: portifilo
      fonts:
        - asset: assets/icons/portifilo.ttf