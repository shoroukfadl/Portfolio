name: portfolio
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Utilities
  cupertino_icons: ^1.0.6
  http: ^1.2.1
  flutter_bloc:
  bloc:
  equatable: 
  get_it: ^7.7.0
  universal_html: ^2.2.4
  shared_preferences: ^2.2.3
  google_fonts:
  go_router: ^14.2.0
  flutter_staggered_animations: ^1.1.1
  flutter_spinkit: ^5.2.1
  change_app_package_name: ^1.4.0
  path: ^1.9.0
  flutter_xlider: ^3.5.0
  simple_tooltip: ^1.2.0
  flutter_widget_from_html: ^0.10.0
  firebase_core: ^3.11.0
  skeletonizer: ^1.1.0
  awesome_snackbar_content: ^0.1.3
  network_info_plus: ^6.1.3
  uuid: ^4.5.1
  firebase_messaging: ^15.2.2
  firebase_messaging_web: ^3.10.2
  flutter_local_notifications: ^18.0.1
  url_strategy:
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  url_launcher: ^6.3.1
  emailjs: ^4.0.0
  responsive_framework:
  json_annotation: 4.11.0
  dotted_border:
  flutter_svg: ^2.0.10
  supabase_flutter:
  intl:
  flutter_animate:
  visibility_detector:
  flutter_dotenv:


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  json_serializable:
  build_runner:

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/Languages/
    - assets/icons/
    - .env
  fonts:
    - family: portifilo
      fonts:
        - asset: assets/icons/portifilo.ttf

