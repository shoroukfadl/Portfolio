name: portfolio
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Utilities
  cupertino_icons: ^1.0.6
  http: ^1.2.1
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  equatable: ^2.0.5
  get_it: ^9.2.1
  universal_html: ^2.2.4
  shared_preferences: ^2.2.3
  google_fonts: ^8.1.0
  go_router: ^17.2.3
  flutter_staggered_animations: ^1.1.1
  flutter_spinkit: ^5.2.1
  change_app_package_name: ^1.5.0
  path: ^1.9.0
  flutter_xlider: ^3.5.0
  simple_tooltip: ^1.2.0
  flutter_widget_from_html: ^0.17.2
  firebase_core: ^4.9.0
  skeletonizer: ^2.1.3
  awesome_snackbar_content:
  network_info_plus: ^8.1.0
  uuid: ^4.5.1
  firebase_messaging: ^16.2.2
  firebase_messaging_web: ^4.1.7
  flutter_local_notifications: ^21.0.0
  url_strategy:
  cloud_firestore: ^6.4.1
  firebase_storage: ^13.4.1
  url_launcher: ^6.3.1
  emailjs: ^4.0.0
  responsive_framework: ^1.5.1
  json_annotation: ^4.11.0
  dotted_border: ^3.1.0
  flutter_svg: ^2.0.10
  supabase_flutter: ^2.8.4
  intl: ^0.20.2
  flutter_animate: ^4.5.0
  visibility_detector: ^0.4.0+2
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.8.0
  build_runner: ^2.4.13

  flutter_launcher_icons: "^0.14.4"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.jpg"
  web:
    generate: true
    image_path: "assets/logo.jpg"
    background_color: "#FFFFFF"
    theme_color: "#000000"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/Languages/
    - assets/icons/
  fonts:
    - family: portifilo
      fonts:
        - asset: assets/icons/portifilo.ttf