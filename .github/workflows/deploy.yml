name: Deploy Flutter Web & Keep Supabase Alive

on:
  push:
    branches:
      - Shorouk
  schedule:
    # كل 3 أيام - بيمنع Supabase من الـ auto-pause بعد 7 أيام خمول
    - cron: '0 0 */3 * *'
  workflow_dispatch:

# Prevent concurrent deployments
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------
  # بيشتغل بس لما يحصل push على الـ branch (مش مع الجدولة)
  # ---------------------------------------------------------
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # 5. Build Flutter Web
      - name: Build Flutter Web
        run: |
          flutter build web --release \
            --base-href "/Portfolio/" \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      # 6. Fix GitHub Pages routing for PathUrlStrategy
      - name: Create 404 fallback page
        run: cp build/web/index.html build/web/404.html

      # 7. Upload build to GitHub Pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------
  # بيشتغل بس مع الجدولة (كل 3 أيام) عشان يفضل Supabase صاحي
  # ---------------------------------------------------------
  keep-supabase-alive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase project
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"